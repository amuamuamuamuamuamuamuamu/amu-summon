<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>あむ召喚</title>
<style>
:root{--ink:#17233d;--pink:#f7d9e9;--blue:#9be1f4}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,"Noto Sans JP",sans-serif;color:var(--ink);background:linear-gradient(135deg,#f7d9e9 0%,#e9faff 54%,#cff8ff 100%)}.page{max-width:560px;margin:8px auto;padding:0 8px}.card{background:#fff;border:2px solid var(--ink);border-radius:17px;padding:34px 14px;box-shadow:2px 2px 0 rgba(23,35,61,.12)}.hidden{display:none!important}h1{font-size:22px;margin:0 0 20px}.room-list{display:grid;gap:9px}.room-row{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center}.room-link{display:block;background:var(--blue);color:var(--ink);text-decoration:none;border:2px solid var(--ink);border-radius:9px;padding:12px;font-weight:800;box-shadow:1px 1px 0 var(--ink)}.copy-url{width:38px;height:30px;padding:0;background:#fff;border:1px solid #b3bac6;border-radius:8px;color:#596273;font-size:11px}.copy-url:active{transform:translateY(1px)}input,button{font:inherit}input{width:100%;padding:12px;border:2px solid var(--ink);border-radius:10px;margin:8px 0}button{padding:11px;border:2px solid var(--ink);border-radius:10px;font-weight:900;cursor:pointer}.primary{background:#f24f9f;color:#fff}.secondary{background:var(--blue)}.monster{display:block;width:100%;height:300px;object-fit:contain}.monster-name{text-align:center;font-size:48px}.meta{text-align:center}.meta span{display:inline-block;margin:5px}.feeling{text-align:center;padding:10px;background:#fff0f8}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stat{border:1px solid #b9d6ee;padding:7px}.bar{height:9px;background:#dcebf4}.fill{height:100%;background:#f24f9f}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.notice{text-align:center}
</style>
</head>
<body><main class="page">
<section id="admin" class="card"><h1>空いているアカウントを選んでください</h1><div class="room-list">
<div class="room-row"><a class="room-link" href="?room=1">1　空いている</a><button class="copy-url" data-room="1">URL</button></div>
<div class="room-row"><a class="room-link" href="?room=2">2　空いている</a><button class="copy-url" data-room="2">URL</button></div>
<div class="room-row"><a class="room-link" href="?room=3">3　空いている</a><button class="copy-url" data-room="3">URL</button></div>
<div class="room-row"><a class="room-link" href="?room=4">4　空いている</a><button class="copy-url" data-room="4">URL</button></div>
<div class="room-row"><a class="room-link" href="?room=5">5　空いている</a><button class="copy-url" data-room="5">URL</button></div>
<div class="room-row"><a class="room-link" href="?room=6">6　空いている</a><button class="copy-url" data-room="6">URL</button></div>
<div class="room-row"><a class="room-link" href="?room=7">7　空いている</a><button class="copy-url" data-room="7">URL</button></div>
<div class="room-row"><a class="room-link" href="?room=8">8　空いている</a><button class="copy-url" data-room="8">URL</button></div>
<div class="room-row"><a class="room-link" href="?room=9">9　空いている</a><button class="copy-url" data-room="9">URL</button></div>
<div class="room-row"><a class="room-link" href="?room=10">10　空いている</a><button class="copy-url" data-room="10">URL</button></div>
</div></section>
<section id="start" class="card hidden"><h1>あむ召喚</h1><p>召喚士の名前を入力してください。</p><input id="player" maxlength="12" placeholder="召喚士の名前"><button id="summon" class="primary" disabled>モンスターを召喚する</button><button id="backAdmin" class="secondary">管理画面へ戻る</button></section>
<section id="game" class="card hidden"><div>召喚士：<b id="playerName"></b></div><img id="monster" class="monster" alt="召喚モンスター"><h1 id="monsterName" class="monster-name"></h1><div class="meta"><span id="level"></span><span id="stage"></span><span>召喚中</span></div><div id="feeling" class="feeling"></div><div id="stats" class="stats"></div><div class="actions"><button id="evolve" class="secondary">進化させる</button><button id="replace" class="primary">モンスター交代</button></div><p id="notice" class="notice"></p><div id="log"></div><button id="gameAdmin" class="secondary">管理画面へ戻る</button></section>
</main><script src="game-data.js"></script><script src="app.js"></script></body></html>
