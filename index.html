<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>あむ召喚</title>
<style>
:root{--ink:#17233d;--blue:#9be1f4;--pink:#f35a9e;--paper:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,"Noto Sans JP",sans-serif;color:var(--ink);background:linear-gradient(135deg,#f7d9e9,#e9faff 55%,#cff8ff)}button{font:inherit;cursor:pointer}.page{max-width:560px;margin:8px auto;padding:0 8px}.card{background:var(--paper);border:2px solid var(--ink);border-radius:17px;padding:28px 14px;box-shadow:2px 2px 0 rgba(23,35,61,.12)}.hidden{display:none!important}h1{font-size:24px;margin:0 0 20px;text-align:center}.sub{text-align:center;margin:0 0 18px}.room-list{display:grid;gap:9px}.room-row{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center}.room-link{display:block;background:var(--blue);color:var(--ink);text-decoration:none;border:2px solid var(--ink);border-radius:9px;padding:12px;font-weight:800;box-shadow:1px 1px 0 var(--ink)}.copy-url{width:38px;height:30px;padding:0;background:#fff;border:1px solid #b3bac6;border-radius:8px;color:#596273;font-size:11px}.main-actions{display:grid;gap:13px}.big-button{padding:20px 12px;border:2px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);font-size:22px;font-weight:900}.summon{background:var(--pink);color:#fff}.warehouse{background:var(--blue)}.small{width:100%;padding:10px;border:2px solid var(--ink);border-radius:9px;background:#fff;font-weight:800}.monster-img{display:block;width:100%;height:300px;object-fit:contain}.name{font-size:36px;text-align:center;margin:4px 0}.mood{padding:11px;text-align:center;background:#fff0f8;border-radius:10px}.chips{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:10px}.chips span{border:1px solid #b9d6ee;border-radius:99px;padding:4px 8px;font-size:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0}.stat{border:1px solid #b9d6ee;border-radius:8px;padding:7px;font-size:13px}.bar{height:8px;background:#dcebf4;border-radius:9px;margin-top:4px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--pink))}.warehouse-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.monster-card{border:2px solid var(--ink);border-radius:10px;background:#fff;padding:7px;text-align:center}.monster-card.selected{background:#fff0f8;box-shadow:2px 2px 0 var(--pink)}.monster-card img{width:100%;height:115px;object-fit:contain}.monster-card button{width:100%;border:0;background:transparent;font-weight:800}.empty{text-align:center;padding:26px 6px;color:#596273}.danger{background:#fff0f4;color:#9c174d}.summon-stage{position:relative;aspect-ratio:1;border:2px solid var(--ink);border-radius:14px;overflow:hidden;touch-action:none;background:radial-gradient(circle,#291644 0 12%,#100d2c 65%,#070713 100%)}.summon-stage:before,.summon-stage:after{content:"";position:absolute;inset:12%;background:linear-gradient(36deg,transparent 49.4%,#f2cf6d 49.7% 50.3%,transparent 50.6%),linear-gradient(108deg,transparent 49.4%,#f2cf6d 49.7% 50.3%,transparent 50.6%),linear-gradient(180deg,transparent 49.4%,#f2cf6d 49.7% 50.3%,transparent 50.6%),linear-gradient(252deg,transparent 49.4%,#f2cf6d 49.7% 50.3%,transparent 50.6%),linear-gradient(324deg,transparent 49.4%,#f2cf6d 49.7% 50.3%,transparent 50.6%);filter:drop-shadow(0 0 5px #ffe474)}.summon-stage:after{transform:rotate(180deg);opacity:.9}.summon-guide{position:absolute;inset:0;z-index:2;display:grid;place-items:center;color:#fff;text-align:center;padding:40px;font-weight:900;text-shadow:0 1px 5px #000}.touch-dot{position:absolute;width:34px;height:34px;border:3px solid #fff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 17px #ffea76;z-index:3;pointer-events:none}.sound-button{margin-top:12px;width:100%;padding:13px;border:2px solid var(--ink);border-radius:10px;background:var(--blue);font-weight:900}.sound-button.listening{background:var(--pink);color:#fff}.sensor{font-size:12px;text-align:center;min-height:20px;margin:10px 0}.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.replace-list{display:grid;gap:8px}.replace-item{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:9px;padding:5px;background:#fff}.replace-item img{width:50px;height:50px;object-fit:contain}.replace-item button{margin-left:auto;padding:8px;border:2px solid var(--ink);border-radius:8px;background:var(--blue);font-weight:800}
</style>
</head>
<body><main class="page">
<section id="admin" class="card"><h1>空いているアカウントを選んでください</h1><div class="room-list" id="roomList"></div></section>
<section id="main" class="card hidden"><h1>あむ召喚</h1><p class="sub" id="collectionCount"></p><div id="mainMonster"></div><div class="main-actions"><button id="openSummon" class="big-button summon">召喚する</button><button id="openWarehouse" class="big-button warehouse">モンスター倉庫</button></div></section>
<section id="summonView" class="card hidden"><h1>召喚画面</h1><p class="sub">五芒星の好きな場所に指をタッチし、「召喚」と言ってください。</p><div id="summonStage" class="summon-stage"><div class="summon-guide">指の位置・圧力・声から<br>モンスターを呼び出す</div><div id="touchDot" class="touch-dot hidden"></div></div><p id="sensorText" class="sensor">まだ指のデータがありません。</p><button id="listenButton" class="sound-button">音声認識を開始</button><button id="cancelSummon" class="small" style="margin-top:10px">メイン画面へ戻る</button></section>
<section id="resultView" class="card hidden"><h1>召喚結果</h1><div id="resultMonster"></div><p id="resultNotice" class="sub"></p><div id="resultActions"></div></section>
<section id="warehouseView" class="card hidden"><h1>モンスター倉庫</h1><p id="warehouseCount" class="sub">表示したいモンスターを選んでください。</p><div id="warehouseGrid" class="warehouse-grid"></div><button class="small" data-back-main>メイン画面へ戻る</button></section>
</main><script src="game-data.js"></script><script src="app.js"></script></body></html>
