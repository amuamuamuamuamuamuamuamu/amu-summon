<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>あむ召喚</title>
<style>
:root{--ink:#17233d;--blue:#9be1f4;--pink:#f35a9e;--paper:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,"Noto Sans JP",sans-serif;color:var(--ink);background:linear-gradient(135deg,#f7d9e9,#e9faff 55%,#cff8ff)}button{font:inherit;cursor:pointer}.page{max-width:560px;margin:8px auto;padding:0 8px}.card{background:var(--paper);border:2px solid var(--ink);border-radius:17px;padding:28px 14px;box-shadow:2px 2px 0 rgba(23,35,61,.12)}.hidden{display:none!important}h1{font-size:24px;margin:0 0 20px;text-align:center}.sub{text-align:center;margin:0 0 18px}.room-list{display:grid;gap:9px}.room-row{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center}.room-link{display:block;background:var(--blue);color:var(--ink);text-decoration:none;border:2px solid var(--ink);border-radius:9px;padding:12px;font-weight:800;box-shadow:1px 1px 0 var(--ink)}.copy-url{width:38px;height:30px;padding:0;background:#fff;border:1px solid #b3bac6;border-radius:8px;color:#596273;font-size:11px}.main-actions{display:grid;gap:13px}.big-button{padding:20px 12px;border:2px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);font-size:22px;font-weight:900}.summon{background:var(--pink);color:#fff}.warehouse{background:var(--blue)}.small{padding:10px;border:2px solid var(--ink);border-radius:9px;background:#fff;font-weight:800}.back{margin-top:18px;width:100%}.monster-img{display:block;width:100%;height:300px;object-fit:contain}.name{font-size:36px;text-align:center;margin:4px 0}.mood{padding:11px;text-align:center;background:#fff0f8;border-radius:10px}.chips{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:10px}.chips span{border:1px solid #b9d6ee;border-radius:99px;padding:4px 8px;font-size:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0}.stat{border:1px solid #b9d6ee;border-radius:8px;padding:7px;font-size:13px}.bar{height:8px;background:#dcebf4;border-radius:9px;margin-top:4px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--pink))}.warehouse-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.monster-card{border:2px solid var(--ink);border-radius:10px;background:#fff;padding:7px;text-align:center}.monster-card img{width:100%;height:115px;object-fit:contain}.monster-card button{width:100%;border:0;background:transparent;font-weight:800}.notice{min-height:22px;text-align:center}.empty{text-align:center;padding:26px 6px;color:#596273}.danger{background:#fff0f4;color:#9c174d}.detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body><main class="page">
<section id="admin" class="card"><h1>空いているアカウントを選んでください</h1><div class="room-list" id="roomList"></div></section>
<section id="main" class="card hidden"><h1>あむ召喚</h1><p class="sub" id="collectionCount"></p><div id="mainMonster"></div><div class="main-actions"><button id="openSummon" class="big-button summon">召喚する</button><button id="openWarehouse" class="big-button warehouse">モンスター倉庫</button></div></section>
<section id="warehouseView" class="card hidden"><h1>モンスター倉庫</h1><p id="warehouseCount" class="sub">表示したいモンスターを選んでください。</p><div id="warehouseGrid" class="warehouse-grid"></div><button class="small back" data-back-main>メイン画面へ戻る</button></section>
</main><script src="game-data.js"></script><script src="app.js"></script></body></html>
